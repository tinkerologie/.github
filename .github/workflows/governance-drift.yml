name: Governance Drift
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-drift
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare public repositories with the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/governance_drift.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.22
      - name: Audit public workflow and coverage configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --with ruamel.yaml==0.19.1 python scripts/audit_workflow_baseline.py
