name: Dependabot Auto-merge

# Verified minor/patch Dependabot updates use GitHub native auto-merge on public
# repositories with required branch checks. This exits immediately instead of
# holding a runner while checks run. Majors/unclassified updates remain manual.
# The private Free-plan exception retains polling because its branch rules cannot
# enforce the same checks. Never enable native-auto-merge without required CI.
# GITHUB_TOKEN merges do not trigger ordinary push/release workflows.

on:
  workflow_call:
    inputs:
      native-auto-merge:
        description: Enable only where branch rules enforce the required CI and coverage gates.
        type: boolean
        default: false

# Callers must grant the same scopes; a called workflow cannot elevate them.
permissions:
  contents: write # merge the pull request
  pull-requests: write # merge the pull request
  checks: read # wait for check runs
  statuses: read # wait for commit statuses

jobs:
  merge:
    name: Merge when CI passes
    # The pull request author cannot be spoofed; fetch-metadata below also refuses to run
    # unless the head commit is a verified Dependabot commit (so a person's push to a
    # Dependabot branch is never auto-merged).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.native-auto-merge && 5 || 60 }}
    # A newer push to the pull request supersedes the wait on the older commit.
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
      checks: read # wait for check runs
      statuses: read # wait for commit statuses
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # update-type is the largest change in the pull request, so one major update in a
      # group keeps the whole group for a person.
      - name: Decide whether the update may merge on its own
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
        run: |
          # A commit-to-commit bump of an action from a trusted owner: no update type, the
          # new version is a full commit SHA, and every dependency is from that owner.
          trusted_commit_bump() {
            [ -z "$UPDATE_TYPE" ] && [ "$ECOSYSTEM" = github_actions ] || return 1
            [[ "$NEW_VERSION" =~ ^[0-9a-f]{40}$ ]] || return 1
            local dep
            IFS=',' read -ra deps <<< "$DEPENDENCIES"
            [ "${#deps[@]}" -gt 0 ] || return 1
            for dep in "${deps[@]}"; do
              dep="${dep#"${dep%%[![:space:]]*}"}"
              case "$dep" in
                home-assistant/actions/* | hacs/action) ;;
                *) return 1 ;;
              esac
            done
          }
          if trusted_commit_bump; then
            UPDATE_TYPE=trusted-commit-bump
          fi

          case "$UPDATE_TYPE" in
            trusted-commit-bump)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Commit bump of a trusted action ($DEPENDENCIES): will merge when the configured checks pass."
              ;;
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$UPDATE_TYPE ($DEPENDENCIES): will merge when the configured checks pass."
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${UPDATE_TYPE:-unclassified update} ($DEPENDENCIES): left for a person to review."
              ;;
          esac

      - name: Enable native auto-merge after required checks
        if: steps.decide.outputs.eligible == 'true' && inputs.native-auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
      - name: Wait for every other check, then merge
        if: steps.decide.outputs.eligible == 'true' && !inputs.native-auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # This run itself never settles while it waits.
          ignored() { [[ "$1" == *"/actions/runs/${GITHUB_RUN_ID}/"* ]]; }
          # Codecov can stay pending forever on lock-file-only changes: do not wait for it,
          # but do count its result once it reports.
          codecov() { [[ "$1" == codecov/* ]]; }

          settled=0
          for attempt in $(seq 1 110); do
            sleep 30
            pending=(); failed=(); passed=0
            # Read both APIs up front and stop on any failure: a lost response must never be
            # mistaken for "no failing checks".
            # Only the newest run of each check counts (highest id, so a replacement that is
            # still queued wins): a run superseded by a newer one, for example a labeler run
            # cancelled by its concurrency group, is not a failure.
            if ! runs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              | jq -r '[.[].check_runs[]] | group_by(.name) | map(max_by(.id)) | .[]
                  | [.name, .status, (.conclusion // "-"), (.details_url // "-")] | @tsv')"; then
              echo "::error::Could not read the check runs for ${HEAD_SHA}."
              exit 1
            fi
            if ! statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')"; then
              echo "::error::Could not read the commit statuses for ${HEAD_SHA}."
              exit 1
            fi
            # Fields are never empty ("-" placeholders): tab is whitespace to `read`, so an
            # empty field would shift the rest.
            while IFS=$'\t' read -r name status conclusion url; do
              [ -z "$name" ] && continue
              ignored "$url" "$name" && continue
              if [ "$status" != completed ]; then
                codecov "$name" || pending+=("$name")
              else
                case "$conclusion" in
                  success) passed=$((passed + 1)) ;;
                  skipped | neutral) ;;
                  *) failed+=("$name=$conclusion") ;;
                esac
              fi
            done <<< "$runs"
            while IFS=$'\t' read -r context state; do
              [ -z "$context" ] && continue
              case "$state" in
                success) ;;
                pending) codecov "$context" || pending+=("$context") ;;
                *) failed+=("$context=$state") ;;
              esac
            done <<< "$statuses"

            if [ "${#failed[@]}" -gt 0 ]; then
              echo "::error::Not merging: ${failed[*]}"
              exit 1
            fi
            if [ "${#pending[@]}" -gt 0 ]; then
              settled=0
              echo "Waiting for: ${pending[*]}"
              continue
            fi
            # CI may not have started yet; give it five minutes to appear.
            if [ "$passed" -eq 0 ]; then
              settled=0
              if [ "$attempt" -ge 10 ]; then
                echo "::error::Not merging: no check ran on ${HEAD_SHA}, so nothing has verified this update."
                exit 1
              fi
              echo "Waiting for checks to start"
              continue
            fi
            # Two quiet polls in a row, so checks that start late (e.g. after another
            # workflow finishes) are not missed.
            settled=$((settled + 1))
            [ "$settled" -ge 2 ] || continue
            break
          done
          if [ "$settled" -lt 2 ]; then
            echo "::error::Not merging: checks were still running after the time limit."
            exit 1
          fi

          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')"
          if [ "$state" != "OPEN ${HEAD_SHA}" ]; then
            echo "::notice::The pull request changed while waiting ($state); leaving it to the newer run."
            exit 0
          fi
          # Another merge to the default branch at the same moment fails this one with "Base
          # branch was modified"; the pull request is still mergeable, so try again.
          for merge_attempt in 1 2 3; do
            if output="$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" 2>&1)"; then
              echo "::notice::Merged after $passed passing checks."
              exit 0
            fi
            echo "$output"
            if [[ "$output" != *"Base branch was modified"* ]] || [ "$merge_attempt" -eq 3 ]; then
              echo "::error::Merge failed."
              exit 1
            fi
            echo "The default branch moved during the merge; retrying in 20 seconds."
            sleep 20
          done
